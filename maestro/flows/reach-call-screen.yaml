# Subflow: sign up + join matching queue, waiting on CallScreen to appear.
# clearState gives both devices the default filters (app/src/call/filters.ts),
# so tapping "Find a match" close enough in time pairs them.
#
# appId inherited from maestro/config.yaml (workspace-level default).
---
- runFlow:
    file: signup-and-reach-match-screen.yaml
    env:
      USER_LABEL: ${USER_LABEL}

- tapOn:
    id: "match-find-button"

- extendedWaitUntil:
    visible:
      id: "call-screen"
    timeout: 30000
