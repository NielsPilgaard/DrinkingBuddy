x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://localhost:3100/loki/api/v1/push"
    loki-retries: "3"
    loki-batch-size: "400"
    max-size: "10m"
    max-file: "3"

services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3100:3100"   # Loki push API (for docker loki logging driver)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./alembic:/srv/alembic

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *loki-logging

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drinkingbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drinkingbuddy}
      POSTGRES_DB: ${POSTGRES_DB:-drinkingbuddy}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drinkingbuddy} -d ${POSTGRES_DB:-drinkingbuddy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *loki-logging

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *loki-logging

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    env_file:
      - .env
    command: >
      -n
      --listening-port=3478
      --realm=drinkingbuddy.local
      --use-auth-secret
      --static-auth-secret=${COTURN_SECRET:-changeme}
      --no-cli
      --min-port=49152
      --max-port=49172
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49172:49152-49172/udp"
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *loki-logging

volumes:
  postgres_data:
