[project]
name = "drinkingbuddy-backend"
version = "0.1.0"
description = "DrinkingBuddy FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "redis>=8.0",
    "websockets>=16.1",
    "opentelemetry-sdk>=1.43",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-instrumentation-redis>=0.64b0",
    "opentelemetry-instrumentation-logging>=0.64b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.14",
    "ruff>=0.15",
    "ty>=0.0.59",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker (testcontainers).",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.environment]
python-version = "3.12"
